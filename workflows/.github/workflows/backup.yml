name: Weekly backup by email
on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Export tables
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          mkdir backup
          for t in events maintenance documents; do
            curl -fsS "$URL/rest/v1/$t?select=*" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o backup/$t.json
          done
          zip -r "sim-backup-$(date +%F).zip" backup
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          to: ${{ secrets.BACKUP_TO }}
          from: Sim Manager <${{ secrets.SMTP_USER }}>
          subject: Sim Manager backup
          body: Weekly data backup attached (events, maintenance, document list).
          attachments: sim-backup-*.zip
